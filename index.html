<title>Flat Repairs Shopping</title>

  --budget:#3a5f8f; --durable:#5d4a8a; --aesthetic:#8a4a3a; --alt:#5f6670;
  --warn:#9a5b00; --badge-ink:#ffffff;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#16181b; --card:#1f2226; --ink:#e8e6e1; --muted:#a2a7ad; --line:#33373d;
    --accent:#d6b57f; --accent-soft:#2e2a22; --rec:#5cc391; --rec-soft:#1c2c24;
    --budget:#8fb3e3; --durable:#b9a6e6; --aesthetic:#e3a493; --alt:#a2a7ad; --warn:#e0a040; --badge-ink:#16181b;
  }
}
:root[data-theme="dark"]{
  --bg:#16181b; --card:#1f2226; --ink:#e8e6e1; --muted:#a2a7ad; --line:#33373d;
  --accent:#d6b57f; --accent-soft:#2e2a22; --rec:#5cc391; --rec-soft:#1c2c24;
  --budget:#8fb3e3; --durable:#b9a6e6; --aesthetic:#e3a493; --alt:#a2a7ad; --warn:#e0a040; --badge-ink:#16181b;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
a{color:var(--accent)}
.wrap{max-width:1100px;margin:0 auto;padding:24px 16px 64px}
header h1{font:600 28px/1.2 Georgia,"Times New Roman",serif;margin:0 0 4px}
header p{margin:4px 0;color:var(--muted)}
.notes{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0 8px}
.pill{background:var(--accent-soft);border:1px solid var(--line);border-radius:999px;padding:4px 12px;font-size:13px}
nav.toc{display:flex;flex-wrap:wrap;gap:6px;margin:16px 0 24px}
nav.toc a{text-decoration:none;font-size:13px;border:1px solid var(--line);background:var(--card);border-radius:8px;padding:4px 10px;color:var(--ink)}
section.item{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;margin:0 0 18px}
.item h2{margin:0;font:600 20px/1.3 Georgia,serif}
.room{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.need{margin:8px 0 4px}
.measure{font-size:13px;color:var(--warn);margin:4px 0}
.qty{font-size:13px;color:var(--muted)}
.opts{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px;margin-top:14px}
.opt{border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:6px;position:relative;background:var(--card)}
.opt.rec{border:2px solid var(--rec);background:linear-gradient(var(--rec-soft),var(--card) 60%)}
.imgbox{height:140px;display:flex;align-items:center;justify-content:center;background:#fff;border-radius:8px;overflow:hidden}
.imgbox img{max-width:100%;max-height:140px;object-fit:contain}
.imgbox.none{background:var(--accent-soft);color:var(--muted);font-size:12px;text-align:center;padding:8px}
.badges{display:flex;gap:6px;flex-wrap:wrap}
.badge{font-size:11px;font-weight:600;border-radius:6px;padding:2px 8px;color:var(--badge-ink)}
.t-Budget{background:var(--budget)} .t-Durable{background:var(--durable)} .t-Aesthetic{background:var(--aesthetic)} .t-Alt{background:var(--alt)}
.badge.recb{background:var(--rec)}
.opt h3{font-size:14px;margin:0;line-height:1.35}
.price{font-size:17px;font-weight:700}
.sup{font-size:12px;color:var(--muted)}
.stock{font-size:12px;border-left:3px solid var(--line);padding-left:8px}
.onotes{font-size:13px;color:var(--muted)}
.opt a.go{margin-top:auto;font-size:13px;font-weight:600}
.extras{margin-top:12px;font-size:13px}
.extras ul{margin:6px 0 0;padding-left:18px}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{text-align:left;border-bottom:1px solid var(--line);padding:6px 8px;vertical-align:top}
th{color:var(--muted);font-weight:600}
.tablewrap{overflow-x:auto;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:8px;margin-bottom:18px}
h2.sec{font:600 22px Georgia,serif;margin:28px 0 10px}
.total{font-weight:700}
.themebtn{float:right;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:8px;padding:4px 10px;cursor:pointer}
footer{color:var(--muted);font-size:12px;margin-top:30px}
@media (max-width:520px){header h1{font-size:23px}.opts{grid-template-columns:1fr}}
</style>
</head>
